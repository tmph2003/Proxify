services:
  proxify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxify_app
    ports:
      # Ánh xạ port proxy (8080) ra máy host
      - "8080:8080"
    environment:
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8080
      - DASHBOARD_PORT=8888
      - COMMIT_BATCH_SIZE=50
      - COMMIT_INTERVAL=2.0
      - DUMP_DIR=dumps
      - SPOOF_DOMAINS=${SPOOF_DOMAINS:-}
      - IGNORE_HOSTS=${IGNORE_HOSTS:-googlevideo.com,c.youtube.com,accounts.youtube.com,signaler-pa.youtube.com,accounts.google.com,clients6.google.com,client-channel.google.com,gvt1.com,gvt2.com,gvt3.com,1e100.net,nel.goog,msftncsi.com,windowsupdate.com}
      - DB_DSN=postgresql://proxify_user:proxify_pass@db:5432/proxify_db
      - DB_INTEGRATION_ENABLED=${DB_INTEGRATION_ENABLED:-true}
      - RECORD_RETENTION_DAYS=${RECORD_RETENTION_DAYS:-7}
      - PROXIFY_EXTENSIONS_DIR=/app/extensions
      - PROXIFY_CA_DIR=/root/.mitmproxy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ~/.mitmproxy:/root/.mitmproxy
      - ./private/extensions:/app/extensions

  ui:
    build: ./frontend
    container_name: proxify_ui
    ports:
      # UI Dashboard sẽ nghe trên port 8888 của máy host (Nginx -> React SPA)
      - "8888:80"
    depends_on:
      proxify:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: proxify_db
    shm_size: 512mb
    environment:
      - POSTGRES_USER=proxify_user
      - POSTGRES_PASSWORD=proxify_pass
      - POSTGRES_DB=proxify_db
    ports:
      - "5432:5432"
    volumes:
      - proxify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxify_user -d proxify_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  proxify_pgdata:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1420"
