[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxify"
version = "2.0.0"
description = "Request capture and plugin-based interception tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "tmph2003" }
]
dependencies = [
    "mitmproxy>=10.1",
    "aiohttp>=3.9",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0.0",
]

[project.scripts]
proxify = "proxify.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
