[package]
name = "proxify"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "proxify"
path = "src/lib.rs"

[dependencies]
proxify-core = { workspace = true }
proxify-sdk = { workspace = true }
ext-youtube = { workspace = true }
ext-zalo = { workspace = true }
ext-facebook = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
deadpool-postgres = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
async-trait = { workspace = true }
flate2 = { workspace = true }

[[test]]
name = "e2e_proxy_tests"
path = "tests/e2e_proxy_tests.rs"

[[test]]
name = "e2e_websocket_tests"
path = "tests/e2e_websocket_tests.rs"

[[test]]
name = "e2e_extension_tests"
path = "tests/e2e_extension_tests.rs"

[[test]]
name = "adversarial_m1_tests"
path = "tests/adversarial_m1_tests.rs"

[[test]]
name = "m1_adversarial_tests"
path = "tests/m1_adversarial_tests.rs"

[[test]]
name = "adversarial_m2_tests"
path = "tests/adversarial_m2_tests.rs"

[[test]]
name = "adversarial_m3_tests"
path = "tests/adversarial_m3_tests.rs"

[[test]]
name = "adversarial_tier5_hardening_tests"
path = "tests/adversarial_tier5_hardening_tests.rs"



[[bench]]
name = "proxy_micro_benches"
path = "benches/proxy_micro_benches.rs"
harness = false

[workspace]
resolver = "2"
members = [
    "crates/proxify-sdk",
    "crates/proxify-core",
    "crates/ext-youtube",
    "crates/ext-zalo",
    "crates/ext-facebook",
    "crates/proxify-server",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Proxify Team"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "fs"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = { version = "1.7", features = ["serde"] }
http = "1.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.1"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "gzip", "brotli", "deflate", "cookies", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
url = "2.5"
urlencoding = "2.1"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
flate2 = "1.0"
brotli = "6.0"
zstd = "0.13"
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
time = "0.3"
rand = "0.8"
rand_distr = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dashmap = "6.1"
parking_lot = "0.12"
futures-util = "0.3"
once_cell = "1.20"
criterion = { version = "0.5", features = ["async_tokio"] }
mimalloc = { version = "0.1", default-features = false }

proxify-sdk = { path = "crates/proxify-sdk" }
proxify-core = { path = "crates/proxify-core" }
ext-youtube = { path = "crates/ext-youtube" }
ext-zalo = { path = "crates/ext-zalo" }
ext-facebook = { path = "crates/ext-facebook" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

