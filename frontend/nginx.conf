server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver for dynamic service discovery
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://proxify:8888;

    # Tăng giới hạn payload body từ Extension Bridge lên 50MB (tránh lỗi 413 Request Entity Too Large khi cào trang sâu)
    client_max_body_size 50M;

    # Phục vụ thư mục static từ React build
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy các API request sang container proxify
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket sang container proxify
    location /ws {
        proxy_pass http://proxify:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
